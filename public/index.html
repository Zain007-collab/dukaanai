<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noor Boutique · DukaanAI</title>
  <meta name="description" content="Shop eastern wear with an AI sales assistant that speaks English and Roman Urdu.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="logo">Dukaan<span>AI</span><small id="shopName">Noor Boutique · Islamabad</small></div>
    <div class="spacer"></div>
    <label class="who">Shopper ID <input id="userId" autocomplete="off" title="Each ID is a separate shopper with its own memory"></label>
    <button class="btn small" id="newChat" title="Start a new conversation (long-term memory stays)">New chat</button>
    <a class="btn small" href="/seller.html">Seller dashboard</a>
  </header>

  <main class="layout">
    <section>
      <div class="hero">
        <h1>Eastern wear for every occasion</h1>
        <p>Shaadi, mehndi, Eid or everyday. Ask our assistant in English or Roman Urdu. Cash on delivery across Pakistan.</p>
      </div>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"><p class="empty">Loading the collection…</p></div>
    </section>

    <aside class="chat" aria-label="Shop assistant">
      <div class="chat-head">
        <div class="avatar">N</div>
        <div><b>Noor, your shop assistant</b><small>Replies in seconds · English / Roman Urdu</small></div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="suggest" id="suggest"></div>
      <form class="composer" id="form">
        <input id="input" placeholder="e.g. shaadi ke liye kuch chahiye, 5000 tak, M size" autocomplete="off" maxlength="1500">
        <button class="btn primary" type="submit">Send</button>
      </form>
    </aside>
  </main>
  <script src="/store.js"></script>
</body>
</html>
